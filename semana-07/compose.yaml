# Alternativa a la instalación nativa. No ejecutar ambas en el mismo puerto.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PGUSER:?Configurar PGUSER en .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Configurar PGPASSWORD en .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - aula_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  aula_data:
